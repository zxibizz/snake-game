<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Змейград</title>
<meta name="theme-color" content="#111411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Змейград">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Material 3, тёмная схема от зелёного */
:root{
  --surface:#111411; --surf-low:#191D19; --surf:#1D211D; --surf-high:#272B27; --surf-highest:#323632;
  --on:#E1E3DE; --on-var:#C2C9BD; --outline:#8C9388; --outline-var:#424940;
  --primary:#88D982; --on-primary:#003A06; --pc:#00530F; --on-pc:#A3F69C;
  --sc:#3A4B38; --on-sc:#D5E8CF; --tc:#1F4D53; --on-tc:#BCEBF1; --tertiary:#A0CFD4;
  --ec:#93000A; --on-ec:#FFDAD6; --error:#FFB4AB;
  --elev1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --elev3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
  --font:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface);color:var(--on);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{position:fixed;inset:0}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* --- кнопки --- */
.btn{height:40px;padding:0 24px;border-radius:20px;font-size:14px;font-weight:500;letter-spacing:.1px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.btn:active::after{opacity:.12}
.btn svg.i{width:18px;height:18px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--sc);color:var(--on-sc)}
.btn.outlined{border:1px solid var(--outline);color:var(--primary)}
.btn.text{color:var(--primary);padding:0 12px}
.btn.big{height:56px;border-radius:16px;font-size:16px}
.btn:disabled{opacity:.38;pointer-events:none}
.icon-btn{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;
  background:var(--surf-high);color:var(--on-var);box-shadow:var(--elev1);pointer-events:auto}
.icon-btn:active{background:var(--surf-highest)}

/* --- главный экран --- */
.screen{position:fixed;inset:0;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  background:rgba(17,20,17,.72);padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.col{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:16px;padding:8px 4px 4px}
.brand img{width:56px;height:56px;border-radius:16px}
.brand h1{margin:0;font-size:32px;font-weight:400;line-height:40px}
.brand p{margin:0;color:var(--on-var);font-size:14px}
.card{background:var(--surf);border-radius:16px;padding:16px}
.section-title{margin:12px 4px 0;font-size:16px;font-weight:500;color:var(--primary);display:flex;align-items:baseline;gap:8px}
.section-title small{color:var(--on-var);font-weight:400;font-size:13px}
.field{position:relative;margin-bottom:16px}
.field input{width:100%;height:56px;border-radius:4px;border:1px solid var(--outline);background:transparent;color:var(--on);
  font:inherit;font-size:16px;padding:0 16px;outline:none;-webkit-user-select:text;user-select:text}
.field input:focus{border:2px solid var(--primary);padding:0 15px}
.field label{position:absolute;left:12px;top:-8px;padding:0 4px;background:var(--surf);font-size:12px;color:var(--on-var)}
.field input:focus + label{color:var(--primary)}
.label{font-size:12px;color:var(--on-var);margin:0 0 8px 4px}
#skins{display:flex;gap:10px;flex-wrap:wrap}
.skin{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#111}
.skin svg.i{width:20px;height:20px;opacity:0}
.skin.sel{outline:2px solid var(--on);outline-offset:2px}
.skin.sel svg.i{opacity:1}
.list{background:var(--surf);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:16px;width:100%;padding:12px 16px;min-height:72px;text-align:left;position:relative}
.item+.item{border-top:1px solid var(--outline-var)}
.item:active{background:var(--surf-high)}
.lead{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:none}
.lead.easy{background:var(--pc);color:var(--on-pc)}
.lead.medium{background:var(--tc);color:var(--on-tc)}
.lead.hard{background:var(--ec);color:var(--on-ec)}
.item .txt{flex:1;display:flex;flex-direction:column}
.item .txt b{font-weight:400;font-size:16px;line-height:24px}
.item .txt small{color:var(--on-var);font-size:14px;line-height:20px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;
  border:1px solid var(--outline-var);color:var(--on-var);font-size:13px;font-weight:500;white-space:nowrap}
.chip svg.i{width:18px;height:18px}
.chip.sel{background:var(--sc);color:var(--on-sc);border-color:transparent}
.together{display:flex;flex-direction:column;gap:16px}
.join{display:flex;gap:8px;align-items:center}
.join .field{flex:1;margin:0}
.note{font-size:13px;color:var(--on-var);line-height:18px;display:flex;gap:10px;align-items:flex-start}
.note svg.i{width:20px;height:20px}
.note.ok{color:var(--primary)}
.note.warn{color:var(--error)}
.help{font-size:13px;color:var(--on-var);line-height:19px;padding:0 4px}
.ver{text-align:center;font-size:11px;color:var(--outline)}

/* --- игровой интерфейс --- */
#hud{position:fixed;inset:0;pointer-events:none}
.hud-tl{position:absolute;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
  display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;max-width:46vw}
.stat{background:var(--surf-high);border-radius:16px;padding:6px 14px;box-shadow:var(--elev1);min-height:48px;
  display:flex;flex-direction:column;justify-content:center}
.stat b{font-size:16px;font-weight:500;line-height:20px}
.stat small{font-size:12px;color:var(--on-var);display:flex;align-items:center;gap:4px;line-height:16px}
.stat small svg.i{width:14px;height:14px}
.hud-tc{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%)}
#roomChip{pointer-events:auto;background:var(--surf-high);border:0;height:40px;border-radius:12px;color:var(--on);box-shadow:var(--elev1)}
#roomChip svg.i{color:var(--primary)}
#board{position:absolute;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
  background:var(--surf-high);border-radius:16px;padding:10px 14px;font-size:13px;min-width:168px;box-shadow:var(--elev1)}
#board .row{display:flex;justify-content:space-between;gap:12px;white-space:nowrap;line-height:20px;color:var(--on-var)}
#board .row.me{color:var(--primary);font-weight:500}
#board .row.mate{color:var(--tertiary)}
#board .sep{border-top:1px solid var(--outline-var);margin:4px 0}
#mini{position:absolute;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));width:112px;height:112px}
#fab{pointer-events:auto;position:absolute;right:calc(24px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));
  width:96px;height:96px;border-radius:28px;background:var(--pc);color:var(--on-pc);box-shadow:var(--elev3);
  display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .08s,background .08s}
#fab svg.i{width:40px;height:40px}
#fab.on{background:var(--primary);color:var(--on-primary);transform:scale(.94)}
#snack{position:absolute;top:calc(68px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);
  background:#E1E3DE;color:#2E312D;padding:12px 16px;border-radius:4px;font-size:14px;box-shadow:var(--elev3);
  opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#snack.show{opacity:1;transform:translate(-50%,0)}

/* --- диалоги --- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px;
  overflow:auto;touch-action:pan-y}
.dialog{background:var(--surf-high);border-radius:28px;padding:24px;width:100%;max-width:400px;box-shadow:var(--elev3);margin:auto}
.dialog h3{margin:0 0 16px;font-size:24px;font-weight:400;line-height:32px}
.dialog .body{color:var(--on-var);font-size:14px;line-height:20px}
.dialog .body p{margin:0 0 12px}
.dialog .body b{color:var(--on);font-weight:500}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden;margin:4px 0 8px}
.seg button{flex:1;height:40px;font-size:14px;font-weight:500;color:var(--on);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.seg button+button{border-left:1px solid var(--outline)}
.seg button.on{background:var(--sc);color:var(--on-sc)}
.seg button svg.i{width:18px;height:18px;display:none}
.seg button.on svg.i{display:block}
.dialog .hint{font-size:12px;color:var(--on-var);margin:0 4px 16px;line-height:16px}
.dialog .sub{font-size:14px;font-weight:500;color:var(--on);margin:8px 0 4px}
.big-num{font-size:45px;line-height:52px;color:var(--on);font-weight:400}
.record{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:500}

@media (max-width:600px){
  .hud-tl{max-width:150px}
  #board{font-size:11px;min-width:0;padding:6px 10px}
  #board .row{line-height:16px;gap:8px}
  #mini{width:88px;height:88px}
  #fab{width:80px;height:80px;border-radius:24px}
  .hud-tc{top:auto;bottom:calc(16px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="hud-tl">
    <button class="icon-btn" id="btnMenu" aria-label="Меню" data-icon="pause"></button>
    <button class="icon-btn" id="btnSound" aria-label="Звук"></button>
    <div class="stat" id="score"></div>
  </div>
  <div class="hud-tc" id="roomBox" hidden><button class="chip" id="roomChip"></button></div>
  <div id="board"></div>
  <canvas id="mini" width="224" height="224"></canvas>
  <button id="fab" hidden aria-label="Ускорение" data-icon="bolt"></button>
  <div id="snack"></div>
</div>

<main id="home" class="screen">
  <div class="col">
    <header class="brand">
      <img src="icons/icon-192.png" alt="">
      <div><h1>Змейград</h1><p>Ешь, расти и не врезайся в других змей</p></div>
    </header>

    <section class="card">
      <div class="field"><input id="name" maxlength="12" autocomplete="off" placeholder=" "><label for="name">Имя</label></div>
      <div class="label">Цвет змейки</div>
      <div id="skins"></div>
    </section>

    <h2 class="section-title">Играть одному <small>работает без интернета</small></h2>
    <div class="list">
      <button class="item" data-d="easy"><span class="lead easy" data-icon="mood"></span>
        <span class="txt"><b>Лёгкий</b><small>Добрые боты, можно продолжать после проигрыша</small></span><span id="best-easy"></span></button>
      <button class="item" data-d="medium"><span class="lead medium" data-icon="neutral"></span>
        <span class="txt"><b>Средний</b><small>Боты посерьёзнее, одна жизнь</small></span><span id="best-medium"></span></button>
      <button class="item" data-d="hard"><span class="lead hard" data-icon="fire"></span>
        <span class="txt"><b>Сложный</b><small>Боты охотятся и окружают, одна жизнь</small></span><span id="best-hard"></span></button>
    </div>

    <h2 class="section-title">Играть вместе <small>нужен интернет</small></h2>
    <section class="card together">
      <button class="btn filled big" id="btnCreate"><span data-icon="group"></span>Создать комнату</button>
      <div class="join">
        <div class="field"><input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder=" "><label for="code">Код комнаты</label></div>
        <button class="btn tonal big" id="btnJoin">Войти</button>
      </div>
      <div class="note" id="netNote" hidden></div>
    </section>

    <div class="note" id="offline"></div>
    <div class="help" id="help"></div>
    <div class="ver" id="ver"></div>
  </div>
</main>

<div class="scrim" id="dlg" hidden>
  <div class="dialog" role="dialog" aria-modal="true">
    <h3 id="dlgTitle"></h3>
    <div class="body" id="dlgBody"></div>
    <div class="actions" id="dlgActions"></div>
  </div>
</div>

<script type="module" src="client.js"></script>
</body>
</html>
