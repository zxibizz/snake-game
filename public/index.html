<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snake</title>
<meta name="theme-color" content="#0D1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Material 3, dark scheme from blue; --cta is the main button of the screen and of every dialog ("Play", "Create a room", "Got it"):
   warm on a cold background — a child knows the yellow one is the one to press */
:root{
  --surface:#0D1424; --surf-low:#121A2D; --surf:#162034; --surf-high:#1E2A44; --surf-highest:#283552;
  --on:#E3E8F5; --on-var:#B8C2DA; --outline:#7F8AA6; --outline-var:#3A4560;
  --primary:#8EB8FF; --on-primary:#00285E; --pc:#1A4A9E; --on-pc:#D8E2FF;
  --sc:#2A3A5C; --on-sc:#D6E2FF; --tc:#4F3A5C; --on-tc:#F2DAFF; --tertiary:#DDBCE0;
  --cta:#FFC83D; --on-cta:#3A2800;
  --ec:#93000A; --on-ec:#FFDAD6; --error:#FFB4AB;
  --elev1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --elev3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
  --font:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface);color:var(--on);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{position:fixed;inset:0}
[hidden]{display:none!important}
/* until i18n.js has set the language (it sets <html lang>), show nothing: no flash of the wrong language */
html:not([lang]) body{visibility:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
#c{position:fixed;inset:0;width:100%;height:var(--app-h,100%);display:block;touch-action:none}
/* installed game on iPhone: --app-h is the full screen height (the window is shorter by the status bar, leaving an empty strip at the bottom) */
#hud,.scrim,.screen{height:var(--app-h,auto)}
/* iOS doesn't draw fixed elements below its short window — it clips them at the edge. So in this mode
   (the script sets the tall class) the page itself is as tall as the screen, and the field, UI and dialogs live inside it (absolute) */
:root.tall,:root.tall body{height:var(--app-h)}
:root.tall body{position:relative;inset:auto}
:root.tall #c,:root.tall #hud,:root.tall .scrim,:root.tall .screen,:root.tall #snack,:root.tall #update{position:absolute}

/* --- buttons --- */
.btn{height:40px;padding:0 24px;border-radius:20px;font-size:14px;font-weight:500;letter-spacing:.1px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.btn:active::after{opacity:.12}
.btn svg.i{width:18px;height:18px}
.btn.filled{background:var(--cta);color:var(--on-cta);font-weight:700}
.btn.tonal{background:var(--sc);color:var(--on-sc)}
.btn.outlined{border:1px solid var(--outline);color:var(--primary)}
.btn.text{color:var(--primary);padding:0 12px}
.btn:disabled{opacity:.38;pointer-events:none}
.icon-btn{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;
  background:var(--surf-high);color:var(--on-var);box-shadow:var(--elev1);pointer-events:auto}
.icon-btn:active{background:var(--surf-highest)}

/* --- home screen: a single screen, no scrolling --- */
.screen{position:fixed;inset:0;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  background:rgba(13,20,36,.86);padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom))}
.home{max-width:420px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px;justify-content:space-between}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.top h1{margin:0;font-size:24px;font-weight:500;line-height:36px;text-align:center}
.top .icon-btn{width:44px;height:44px;background:var(--surf-high);box-shadow:none;justify-self:start}
.top .stars{justify-self:end}
.top-l{display:flex;gap:8px;justify-self:start}
.stars{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--surf-high);
  font-size:16px;font-weight:600;color:#FFD447}
.stars svg.i{width:18px;height:18px}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px}
/* a big snake with arrows on the sides — the snake type; the type's skins are swatches under the name */
.pv-wrap{position:relative;width:100%;padding:0 40px} /* arrows on the sides, not over the head and tail */
#preview{width:100%;height:min(230px,24vh);display:block}
.pv-wrap .arr{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border-radius:24px;
  display:flex;align-items:center;justify-content:center;background:rgba(30,42,68,.7);color:var(--on)}
.pv-wrap .arr:active{background:var(--surf-highest)}
.pv-wrap .arr svg.i{width:36px;height:36px}
#skinPrev{left:-6px} #skinNext{right:-6px}
/* the space for labels and swatches is fixed (three lines, two rows of swatches) — otherwise the snake and arrows jump when the type changes */
.skin-info{display:flex;flex-direction:column;align-items:center;max-width:100%}
.skin-info>*{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skin-info b{font-size:20px;font-weight:600;line-height:26px}
#skinName{font-size:15px;line-height:20px;height:20px;color:var(--on-var)}
/* the type's skins are color swatches; up to 6 per row (beads have 12 — two rows) */
/* --sw — swatch, --sg — gap; the height is exactly two rows (beads have 12 skins), other types leave the second row empty */
.swatches{--sw:32px;--sg:8px;display:flex;justify-content:center;align-content:flex-start;flex-wrap:wrap;gap:var(--sg);
  max-width:calc(6 * var(--sw) + 5 * var(--sg));height:calc(2 * var(--sw) + var(--sg));margin:2px auto 0}
.swatches button{width:var(--sw);height:var(--sw);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.swatches button.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--primary)}
.swatches button.locked{opacity:.4}
.swatches button svg.i{width:14px;height:14px;filter:drop-shadow(0 0 2px rgba(0,0,0,.8))}
.skin-info small{display:block;font-size:15px;line-height:20px;height:20px;color:var(--on-var)}
.skin-info small svg.i{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.go{display:flex;flex-direction:column;gap:16px}
/* difficulty — three light tabs */
.tabs{display:flex;justify-content:center;gap:4px}
.tabs button{height:40px;padding:0 16px;border-radius:20px;font-size:15px;font-weight:500;color:var(--on-var)}
.tabs button.on{background:var(--sc);color:var(--on-sc);font-weight:600}
#btnPlay{height:80px;border-radius:40px;font-size:24px;box-shadow:0 0 0 5px rgba(255,200,61,.22),0 8px 22px rgba(255,200,61,.35)}
#btnPlay svg.i{width:34px;height:34px}
#btnTogether{height:48px;font-size:16px;color:var(--primary)}
#btnTogether svg.i{width:20px;height:20px}
.best{text-align:center;font-size:13px;color:var(--on-var);min-height:18px;display:flex;align-items:center;justify-content:center;gap:4px}
.best svg.i{width:16px;height:16px;color:#FFD447}
.btn.big{height:56px;border-radius:28px;font-size:16px}
.field{position:relative}
.field input{width:100%;height:56px;border-radius:4px;border:1px solid var(--outline);background:transparent;color:var(--on);
  font:inherit;font-size:16px;padding:0 16px;outline:none;-webkit-user-select:text;user-select:text}
.field input:focus{border:2px solid var(--primary);padding:0 15px}
.field label{position:absolute;left:12px;top:-8px;padding:0 4px;background:var(--surf-high);font-size:12px;color:var(--on-var)}
.field input:focus + label{color:var(--primary)}
.name-field{margin:8px 0 16px}
.join{display:flex;gap:8px;align-items:center}
.join .field{flex:1}
.or{text-align:center;font-size:13px;color:var(--on-var);margin:16px 0 12px}
.wide{width:100%}
.note{font-size:13px;color:var(--on-var);line-height:18px;display:flex;gap:10px;align-items:flex-start}
.note svg.i{width:20px;height:20px}
.note.ok{color:var(--primary)}
.note.warn{color:var(--error)}
/* small phone (iPhone SE): everything on one screen */
@media (max-height:600px){
  .home{gap:12px}
  #preview{height:21vh}
  .swatches{--sw:28px;--sg:6px}
  .go{gap:10px}
  #btnPlay{height:68px;border-radius:34px}
}
/* phone in landscape: snake picker on the left, buttons on the right */
@media (orientation:landscape) and (max-height:520px){
  .home{max-width:760px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:8px 32px;align-items:center}
  .top{grid-column:1/3}
  #preview{height:min(130px,34vh)}
  .skin-info b{font-size:17px;line-height:22px}
  #skinName,.skin-info small{font-size:13px;line-height:18px;height:18px}
  .skin-info small svg.i{width:14px;height:14px;vertical-align:-2px}
  .swatches{--sw:24px;--sg:6px}
  #btnPlay{height:64px;border-radius:32px}
  .go{gap:10px}
}

/* --- in-game UI: pause, length and place, top 3 --- */
:root{--hud-top:env(safe-area-inset-top)}
/* installed game (the script sets the pwa class: navigator.standalone or display-mode standalone/fullscreen —
   the manifest says fullscreen, and standalone alone in a media query isn't enough): the status bar overlays the page and shades the edge */
:root.pwa{--hud-top:calc(env(safe-area-inset-top) + 16px)}
#hud{position:fixed;inset:0;pointer-events:none}
.hud-tl{position:absolute;top:calc(12px + var(--hud-top));left:calc(12px + env(safe-area-inset-left));
  display:flex;gap:12px;align-items:center}
.hud-tl .icon-btn{width:44px;height:44px;background:rgba(30,42,68,.7);box-shadow:none}
.shadow{text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.5)}
#score{display:flex;align-items:baseline;gap:8px}
#score b{font-size:28px;font-weight:600;line-height:32px}
#score small{font-size:15px;font-weight:500;color:var(--on-var)}
#board{position:absolute;top:calc(14px + var(--hud-top));right:calc(14px + env(safe-area-inset-right));
  font-size:13px;min-width:130px;color:var(--on-var)}
#board .row{display:flex;justify-content:space-between;gap:12px;white-space:nowrap;line-height:20px}
#board .row.me{color:var(--primary);font-weight:600}
#board .row.mate{color:var(--tertiary)}
#board .row .c{color:#FFD447}
#board .row .c1{color:#DCE3EC}
#board .row .c2{color:#E0975A}
#board .gap{line-height:10px;text-align:center;opacity:.6}
.hud-tc{position:absolute;top:calc(12px + var(--hud-top));left:50%;transform:translateX(-50%)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-size:13px;font-weight:500;white-space:nowrap}
.chip svg.i{width:18px;height:18px}
#roomChip{pointer-events:auto;background:rgba(30,42,68,.7);border:0;height:36px;border-radius:18px;color:var(--on)}
#roomChip svg.i{color:var(--primary)}
#fab{pointer-events:auto;position:absolute;right:calc(24px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));
  width:76px;height:76px;border-radius:50%;background:rgba(142,184,255,.16);border:2px solid rgba(142,184,255,.45);color:var(--primary);
  display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .08s,background .08s}
#fab svg.i{width:var(--fab-i,34px);height:var(--fab-i,34px)}
#fab.on{background:var(--primary);color:var(--on-primary);transform:scale(.94)}
.hud-tl{z-index:1} /* pause always on top, even if the boost button was placed over it */
/* boost button setup: dashed outline and a pulse; moved by dragging or by tapping the field */
#fab.edit{border-style:dashed;border-color:var(--primary);background:rgba(142,184,255,.28);animation:fabPulse 1.4s ease-in-out infinite;cursor:grab}
#fab.edit.drag{animation:none;transform:scale(1.06);cursor:grabbing}
@keyframes fabPulse{50%{box-shadow:0 0 0 10px rgba(142,184,255,.18)}}
#fabPanel{pointer-events:auto;position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(360px,calc(100vw - 32px));background:var(--surf-high);border-radius:28px;padding:20px 24px 16px;box-shadow:var(--elev3);z-index:2}
#fabPanel.at-top{bottom:auto;top:calc(72px + var(--hud-top))}
#fabPanel.side{bottom:auto;top:50%;left:75%;transform:translate(-50%,-50%);width:min(340px,calc(50vw - 32px))}
#fabPanel.side.at-left{left:25%}
/* "Controls": joystick / boost tabs on top; sliders in rows "label — slider" so the panel fits a phone in landscape */
.ctl-tabs{margin:0 0 10px}
.ctl-tabs button{flex:1;min-width:0;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fabPanel .sw-row{margin:0;min-height:44px;font-size:15px}
#fabPanel .ctl-row{margin:0;gap:12px;min-height:44px;font-size:15px;color:var(--on)}
.ctl-row span{flex:0 0 38%;overflow-wrap:anywhere;hyphens:auto;line-height:1.15}
.ctl-row input{flex:1}
#fabPanel p{margin:0 0 4px;font-size:14px;line-height:20px;color:var(--on-var)}
#fabPanel .vol svg.i{color:var(--on-var)}
#fabPanel .vol .big svg.i{width:32px;height:32px}
#fabPanel .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#hint{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:80vw;
  text-align:center;font-size:16px;line-height:22px;color:var(--on);transition:opacity .6s}
#hint.fade{opacity:0}
#snack{position:fixed;z-index:20;pointer-events:none;top:calc(68px + var(--hud-top));left:50%;transform:translate(-50%,-8px);
  background:#E1E3DE;color:#2E312D;padding:12px 16px;border-radius:4px;font-size:14px;box-shadow:var(--elev3);
  opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#snack.show{opacity:1;transform:translate(-50%,0)}

#update{position:fixed;z-index:5;top:calc(68px + var(--hud-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;
  width:max-content;max-width:calc(100vw - 24px);padding:4px 4px 4px 16px;border-radius:8px;background:#E1E3DE;color:#2E312D;font-size:14px;box-shadow:var(--elev3)}
#update .btn{color:#1A4A9E;padding:0 12px}

/* --- dialogs --- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px;
  overflow:auto;touch-action:pan-y}
.dialog{background:var(--surf-high);border-radius:28px;padding:24px;width:100%;max-width:400px;box-shadow:var(--elev3);margin:auto}
.dialog h3{margin:0 0 16px;font-size:24px;font-weight:400;line-height:32px}
.dialog .body{color:var(--on-var);font-size:14px;line-height:20px}
.dialog .body:empty{display:none}
.dialog .body p{margin:0 0 12px}
.dialog .body b{color:var(--on);font-weight:500}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;flex-wrap:wrap}
.dialog .actions:empty,#dlgTop:empty{display:none}
/* pause and room menu: your snake, length and place, a big "Continue", settings as a card, "Back to menu" */
.dialog.pz{max-width:360px;text-align:center}
.pz h3{text-align:center;font-size:26px;font-weight:500;margin:0}
#pzSnake{display:block;width:100%;height:96px;margin:-8px 0 0}
.pz-chips{display:flex;justify-content:center;gap:8px;margin:10px 0 20px}
.pz-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--surf);font-size:15px;color:var(--on-var)}
.pz-chip b{color:var(--on);font-weight:600}
.pz-chip svg.i{width:18px;height:18px;color:var(--primary)}
.pz-chip.gold svg.i{color:#FFD447}
.dialog .body .pz-note{margin:-8px 0 16px;font-size:13px;color:var(--on-var)}
.btn.pz-go{width:100%;height:68px;border-radius:34px;font-size:21px;gap:10px;box-shadow:0 0 0 5px rgba(255,200,61,.2),0 8px 22px rgba(255,200,61,.3)}
.btn.pz-go svg.i{width:30px;height:30px}
.pz-list{margin:20px 0 0;background:var(--surf);border-radius:20px;text-align:left;overflow:hidden}
.pz-list>*+*{border-top:1px solid var(--outline-var)}
.pz-list .vol{margin:0;padding:0 16px 0 4px;min-height:56px}
.pz-list .sw-row{margin:0;padding:0 16px;min-height:56px;color:var(--on);font-size:15px}
.pz-list .fab-set{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 16px;margin:0;font-size:15px;color:var(--on);text-align:left}
.pz-list .fab-set svg.i{color:var(--on-var)}
.pz-list .fab-set span{flex:1}
.pz-list .fab-set:active{background:var(--surf-high)}
.btn.pz-out{width:100%;height:56px;border-radius:28px;margin-top:12px;border:2px solid var(--outline);color:var(--on);font-size:17px;font-weight:600;gap:10px}
.btn.pz-out svg.i{width:24px;height:24px}
/* "Sounds" from the pause menu: tabs food / boost / crash / molt, the options below — the chosen one highlighted, a tap plays it at once */
.dialog.pzs{max-width:400px}
.pzs h3{text-align:center;font-size:24px;font-weight:500;margin:0 0 12px}
.snd-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:0 0 14px}
.snd-tabs button{padding:0 2px;font-size:14px;line-height:1.1;overflow:hidden;hyphens:auto}
.snd-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-height:188px;align-content:start}
/* long names (in any language) wrap to a second line instead of being cut off */
.snd-opt{height:40px;padding:0 6px;border-radius:20px;overflow:hidden;line-height:1.1;overflow-wrap:anywhere;hyphens:auto;border:1px solid var(--outline-var);color:var(--on-var);font-size:13px}
/* language picker: native names in two columns, "device language" across both */
.lang-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lang-opts .snd-opt{font-size:15px}
.lang-opts .snd-opt.auto{grid-column:1/-1}
/* backdrop picker: a strip of the chosen backdrop on top, kinds ("random" across the row), then the hue: random or a slider */
#bgPrev{display:block;width:100%;height:110px;border-radius:16px;margin:0 0 14px}
.snd-opts.bg-opts{min-height:0}
.bg-opts .snd-opt.auto{grid-column:1/-1}
.dialog .bg-h{margin:16px 0 8px;font-size:14px;font-weight:500;color:var(--on-var);text-align:left}
.snd-opt.bg-rnd{width:100%}
.vol.bg-hue{margin:4px 0 0}
.vol.bg-hue input::-webkit-slider-runnable-track{background:var(--surf-highest)}
.vol.bg-hue input::-moz-range-progress{background:transparent}
.vol.bg-hue input.off::-webkit-slider-thumb{background:var(--outline)}
.vol.bg-hue input.off::-moz-range-thumb{background:var(--outline)}
.snd-opt.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:500}
/* music: the volume on top, "Random" across the row, a note by the track playing in random mode */
.vol.mus-vol{margin:0 0 12px}
.vol.mus-vol svg.i{color:var(--on-var);flex:none}
.snd-opts.mus-opts{min-height:0}
.mus-opts .snd-opt.auto{grid-column:1/-1}
.mus-opts .snd-opt{height:auto;min-height:40px;padding:4px 6px}
.snd-opt.now{border-color:var(--primary);color:var(--primary)}
.snd-opt.now::after{content:'\00a0♪'}
.dialog .body .mus-off{margin:0 0 10px;font-size:13px}
.pzs .actions .btn.filled{width:100%;height:56px;border-radius:28px;font-size:18px}
/* "Oops!": in a row — "Menu" on the left sized to its content (design decision), the big yellow "Continue" on the right takes the rest */
.dialog.oops .actions{flex-wrap:nowrap;gap:12px;margin-top:20px}
.dialog.oops .btn{white-space:nowrap;height:60px;border-radius:30px;margin:0}
.dialog.oops{padding:24px 20px}
.scrim[data-kind=oops]{padding-left:16px;padding-right:16px}
.dialog.oops .btn.pz-out{flex:0 0 auto;width:auto;padding:0 12px;gap:6px;font-size:16px} /* sized to content, the rest goes to "Continue" */
.dialog.oops .btn.pz-out svg.i{width:22px;height:22px}
.dialog.oops .btn.pz-go{flex:1 1 0;min-width:0;width:auto;font-size:18px;gap:8px;padding:0 12px}
.dialog.oops .btn.pz-go svg.i{width:24px;height:24px}
/* narrow phone (iPhone SE, up to 375 px): smaller margins, labels on one line */
@media (max-width:380px){
  .dialog.pz{padding:20px 16px}
  .dialog.pzs{padding:20px 14px}
  .snd-opt,.snd-tabs button{font-size:13px}
  .scrim[data-kind=oops]{padding-left:12px;padding-right:12px}
  .dialog.oops{padding:20px 14px}
  .dialog.oops .actions{gap:6px}
  .dialog.oops .btn.pz-out{font-size:15px;padding:0 8px;gap:4px}
  .dialog.oops .btn.pz-out svg.i,.dialog.oops .btn.pz-go svg.i{width:20px;height:20px}
  .dialog.oops .btn.pz-go{font-size:15px;padding:0 6px;gap:6px}
  .btn.pz-go{font-size:19px}
  .btn.pz-out,.pz-list .fab-set{font-size:15px;white-space:nowrap}
}
/* phone in landscape: snake and buttons on the left, settings on the right */
@media (orientation:landscape) and (max-height:520px){
  .dialog.pz{max-width:640px;display:grid;grid-template-columns:1fr 1fr;column-gap:24px;align-items:start;padding:16px 24px}
  .dialog.pz .body{display:contents}
  .pz #dlgTop,.pz h3,.pz-chips,.pz .pz-note,.pz-go,.pz-out{grid-column:1}
  .pz-list{grid-column:2;grid-row:1/span 6;margin:0;align-self:center}
  #pzSnake{height:64px;margin:-6px 0 0}
  .pz-chips{margin:6px 0 12px}
  .pz .btn.pz-go{height:56px}
  .pz .btn.pz-out{height:48px;margin-top:10px}
  .dialog.pzs{max-width:640px;padding:12px 24px}
  .pzs h3{font-size:20px;line-height:26px;margin-bottom:8px}
  .scrim[data-kind=pzs]{padding-top:8px;padding-bottom:8px}
  .snd-tabs{margin-bottom:10px}
  #fabPanel{padding:12px 20px 10px}
  #fabPanel .ctl-row,#fabPanel .sw-row{min-height:38px}
  .ctl-tabs{margin-bottom:4px}
  .ctl-tabs button{height:36px}
  #fabPanel .actions{margin-top:6px}
  .snd-opts{grid-template-columns:repeat(5,minmax(0,1fr));min-height:96px}
  .snd-opts.bg-opts{grid-template-columns:repeat(7,minmax(0,1fr));min-height:0}
  .bg-opts .snd-opt.auto{grid-column:auto}
  #bgPrev{height:56px;margin-bottom:8px}
  .dialog .bg-h{margin:10px 0 6px}
  .pzs .actions{margin-top:12px}
  .pzs .actions .btn.filled{height:46px}
  /* "Oops!" in landscape: a denser dialog, otherwise it doesn't fit vertically */
  .dialog.oops{max-width:560px;padding:16px 24px}
  .dialog.oops h3{margin-bottom:8px}
  .dialog.oops .body p{margin-bottom:6px}
  .dialog.oops .big-num{font-size:44px;line-height:48px}
  .dialog.oops .actions{margin-top:10px}
  .dialog.oops .btn{height:52px}
}
.btn.sound{width:44px;padding:0;color:var(--on-var);flex:none}
/* volume: a Material 3 slider — the filled part of the track in the primary color (the script sets --p) */
.vol{display:flex;align-items:center;gap:8px;margin:4px 0 -8px}
.vol input{flex:1;min-width:0;height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;--p:100%}
.vol input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--primary) var(--p),var(--surf-highest) var(--p))}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:var(--primary);border:none}
.vol input::-moz-range-track{height:6px;border-radius:3px;background:var(--surf-highest)}
.vol input::-moz-range-progress{height:6px;border-radius:3px;background:var(--primary)}
.vol input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--primary);border:none}
.btn.sound svg.i{width:24px;height:24px}
/* vibration: a row with a Material 3 switch */
.sw-row{display:flex;align-items:center;gap:12px;min-height:48px;margin:8px 0 -4px 10px;color:var(--on);font-size:14px;cursor:pointer}
.sw-row svg.i{width:24px;height:24px;color:var(--on-var);flex:none}
.sw-row span{flex:1}
.m3-switch{-webkit-appearance:none;appearance:none;position:relative;width:52px;height:32px;margin:0;flex:none;border-radius:16px;
  border:2px solid var(--outline);background:var(--surf-highest);cursor:pointer;transition:background .2s,border-color .2s}
.m3-switch::before{content:'';position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);
  transform:translateY(-50%);transition:left .2s,width .2s,height .2s,background .2s}
.m3-switch:checked{background:var(--primary);border-color:var(--primary)}
.m3-switch:checked::before{left:22px;width:24px;height:24px;background:var(--on-primary,#fff)}
.seg{display:flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden;margin:4px 0 8px}
.seg button{flex:1;height:40px;font-size:14px;font-weight:500;color:var(--on);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.seg button+button{border-left:1px solid var(--outline)}
.seg button.on{background:var(--sc);color:var(--on-sc)}
.seg button svg.i{width:18px;height:18px;display:none}
.seg button.on svg.i{display:block}
.dialog .hint{font-size:12px;color:var(--on-var);margin:0 4px 16px;line-height:16px}
.dialog .sub{font-size:14px;font-weight:500;color:var(--on);margin:8px 0 4px}
.big-num{font-size:57px;line-height:64px;color:var(--on);font-weight:400}
.unlock{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px}
.unlock .xp{display:flex;align-items:center;gap:6px;font-weight:600;color:#FFD447;font-size:15px}
.unlock .xp svg.i{width:18px;height:18px}
.unlock small{font-size:13px;color:var(--on-var)}
.bar{height:8px;border-radius:4px;background:var(--surf-highest);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#FFD447,#FF8A3D);transition:width .3s}
.record{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:500}
.muted{font-size:13px;color:var(--on-var)}

@media (max-width:600px){
  #board{font-size:12px;min-width:110px}
  #board .row{line-height:17px;gap:8px}
  #score b{font-size:24px}
  .hud-tc{top:auto;bottom:calc(16px + env(safe-area-inset-bottom))}
  #snack{white-space:normal;text-align:center;max-width:86vw}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="hud-tl">
    <button class="icon-btn" id="btnMenu" aria-label="Menu" data-t-aria="a11y.menu" data-icon="pause"></button>
    <div id="score" class="shadow"></div>
  </div>
  <div class="hud-tc" id="roomBox" hidden><button class="chip" id="roomChip"></button></div>
  <div id="board" class="shadow"></div>
  <button id="fab" hidden aria-label="Speed boost" data-t-aria="a11y.boost" data-icon="bolt"></button>
  <div id="fabPanel" hidden>
    <div class="tabs ctl-tabs" role="tablist"><button id="ctlTabJoy" role="tab" data-t="ctl.joy">Joystick</button><button id="ctlTabFab" role="tab" data-t="ctl.fab">Boost</button></div>
    <div id="ctlJoy">
      <p id="joyText"></p>
      <label class="sw-row"><span data-t="joy.free">Anywhere on the screen</span><input type="checkbox" class="m3-switch" id="joyFree"></label>
      <label class="vol ctl-row"><span data-t="joy.size">Size</span><input type="range" id="joySize" step="2"></label>
      <label class="vol ctl-row"><span data-t="joy.dead">Dead zone</span><input type="range" id="joyDead" step="1"></label>
      <label class="vol ctl-row"><span data-t="joy.smooth">Smoothing</span><input type="range" id="joySmooth" step="5"></label>
    </div>
    <div id="ctlFab">
      <p data-t="fab.text">Drag the lightning bolt or tap wherever is comfortable</p>
      <div class="vol"><span data-icon="bolt"></span><input type="range" id="fabSize" step="4" aria-label="Button size" data-t-aria="a11y.fabSize"><span data-icon="bolt" class="big"></span></div>
    </div>
    <div class="actions"><button class="btn text" id="fabReset" data-t="fab.reset">Reset</button><button class="btn filled" id="fabDone" data-t="btn.done">Done</button></div>
  </div>
  <div id="hint" class="shadow" hidden></div>
</div>

<main id="home" class="screen">
  <div id="update" role="status" hidden><span data-t="update.banner">A game update is ready</span><button class="btn text" id="btnUpdate" data-t="btn.update">Update</button></div>
  <div class="home">
    <header class="top">
      <div class="top-l">
        <button class="icon-btn" id="btnInfo" aria-label="How to play" data-t-aria="a11y.help" data-icon="help"></button>
        <button class="icon-btn" id="btnLang" aria-label="Language" data-t-aria="lang.title" data-icon="language"></button>
      </div>
      <h1 data-t="app.name">Snake</h1>
      <span class="stars" id="stars" aria-label="Stars" data-t-aria="a11y.stars"></span>
    </header>

    <section class="pick">
      <div class="pv-wrap">
        <canvas id="preview"></canvas>
        <button class="arr" id="skinPrev" aria-label="Previous snake" data-t-aria="a11y.prevType" data-icon="left"></button>
        <button class="arr" id="skinNext" aria-label="Next snake" data-t-aria="a11y.nextType" data-icon="right"></button>
      </div>
      <div class="skin-info"><b id="typeName"></b><span id="skinName"></span><small id="skinLock"></small></div>
      <div class="swatches" id="swatches" aria-label="Skin" data-t-aria="a11y.skins"></div>
    </section>

    <section class="go">
      <div class="tabs" id="diff">
        <button data-d="easy" data-t="diff.easy">Easy</button><button data-d="medium" data-t="diff.medium">Medium</button><button data-d="hard" data-t="diff.hard">Hard</button>
      </div>
      <div class="best" id="best"></div>
      <button class="btn filled big" id="btnPlay"><span data-icon="play"></span><span data-t="btn.play">Play</span></button>
      <button class="btn" id="btnTogether"><span data-icon="group"></span><span data-t="btn.together">Play together</span></button>
    </section>

  </div>
</main>

<div id="snack"></div>
<div class="scrim" id="dlg" hidden>
  <div class="dialog" id="dlgBox" role="dialog" aria-modal="true">
    <div id="dlgTop"></div>
    <h3 id="dlgTitle"></h3>
    <div class="body" id="dlgBody"></div>
    <div class="actions" id="dlgActions"></div>
  </div>
</div>

<script type="module" src="i18n.js"></script>
<script type="module" src="client.js"></script>
</body>
</html>
