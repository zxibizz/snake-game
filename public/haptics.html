<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111411">
<title>Змейка — проверка вибрации</title>
<style>
  :root{color-scheme:dark;--bg:#111411;--surf:#272B27;--on:#E1E3DE;--on-var:#C2C9BD;--primary:#88D982;--on-primary:#003A06}
  body{margin:0;background:var(--bg);color:var(--on);font:16px/1.4 Roboto,system-ui,sans-serif;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
  h1{font-size:22px;font-weight:400;margin:0 0 8px}
  p{color:var(--on-var);font-size:14px;margin:0 0 16px}
  .info{background:var(--surf);border-radius:16px;padding:12px 16px;font-size:13px;color:var(--on-var);margin-bottom:20px;white-space:pre-line}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:480px}
  button{height:64px;border:none;border-radius:20px;background:var(--surf);color:var(--on);font:500 15px Roboto,system-ui,sans-serif;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button:active{background:var(--primary);color:var(--on-primary)}
  button.wide{grid-column:span 2}
  h2{font-size:15px;font-weight:500;margin:24px 0 8px;color:var(--on)}
  #log{margin-top:16px;font-size:13px;color:var(--on-var);min-height:20px}
  a{color:var(--primary)}
</style>
</head>
<body>
<h1>Проверка вибрации</h1>
<p>Нажимай кнопки и запоминай, что чувствуешь. Результат пригодится, чтобы настроить вибрацию в игре.</p>
<div class="info" id="info"></div>

<h2>1. По нажатию</h2>
<div class="grid">
  <button data-ev="click" data-n="1">Тик</button>
  <button data-ev="click" data-n="3">Три тика</button>
  <button data-ev="down" data-n="1">Тик при касании (не при отпускании)</button>
  <button data-ev="click" data-n="5" data-gap="40">Дрожь (5 частых)</button>
</div>

<h2>2. Без касания — как в игре при еде и победах</h2>
<div class="grid">
  <button class="wide" id="later">Тик через 1 секунду</button>
  <button class="wide" id="stream">Тики 2 секунды подряд (8 в секунду)</button>
</div>
<div id="log"></div>
<p style="margin-top:24px"><a href="./">← В игру</a></p>

<script>
  const UA = navigator.userAgent;
  const IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const CAN_VIBRATE = !IOS && typeof navigator.vibrate === 'function';
  const sw = document.createElement('input'); sw.type = 'checkbox'; sw.setAttribute('switch', '');
  document.getElementById('info').textContent =
    `Устройство: ${IOS ? 'iPhone / iPad' : 'не iPhone'}\n` +
    `navigator.vibrate: ${typeof navigator.vibrate === 'function' ? 'есть' : 'нет'}\n` +
    `Переключатель switch (iOS 18+): ${'switch' in sw ? 'есть' : 'не распознан'}\n` +
    `Способ: ${CAN_VIBRATE ? 'vibrate' : IOS ? 'щелчок переключателя' : 'нет'}`;

  let label = null;
  function iosTap() {
    if (!label) {
      label = document.createElement('label');
      label.setAttribute('aria-hidden', 'true'); label.style.display = 'none';
      const inp = document.createElement('input'); inp.type = 'checkbox'; inp.setAttribute('switch', '');
      label.appendChild(inp); document.head.appendChild(label);
    }
    label.click();
  }
  function tap(n = 1, gap = 70) {
    if (CAN_VIBRATE) {
      const pat = []; for (let i = 0; i < n; i++) { if (i) pat.push(gap); pat.push(12); }
      navigator.vibrate(pat); return;
    }
    iosTap();
    for (let i = 1; i < n; i++) setTimeout(iosTap, i * gap);
  }
  const log = (t) => { document.getElementById('log').textContent = t; };
  document.querySelectorAll('button[data-ev]').forEach((b) => {
    const go = () => { tap(Number(b.dataset.n), Number(b.dataset.gap) || 70); log(`«${b.textContent}» — почувствовал?`); };
    if (b.dataset.ev === 'down') b.addEventListener('pointerdown', go);
    else b.addEventListener('click', go);
  });
  document.getElementById('later').addEventListener('click', () => {
    log('Жду секунду…');
    setTimeout(() => { tap(1); log('Тик был сейчас — почувствовал?'); }, 1000);
  });
  document.getElementById('stream').addEventListener('click', () => {
    log('Тики идут…');
    let k = 0;
    const id = setInterval(() => { tap(1); if (++k >= 16) { clearInterval(id); log('Готово — сколько тиков почувствовал: все, часть, ни одного?'); } }, 125);
  });
</script>
</body>
</html>
